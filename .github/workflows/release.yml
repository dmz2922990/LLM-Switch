name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Generate release body
        id: release_body
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE="$([ -z "$PREV" ] && echo HEAD || echo ${PREV}..HEAD)"
          # clean: strip "[type:...]" prefix, cut verbose tail after " - ", dedupe
          clean() {
            sed -E 's/^\[(func_add|func_update|bug_fix):[^]]*\] ?//' \
              | sed -E 's/ - .*$//' \
              | sort -u
          }
          FEAT=$(git log $RANGE --pretty=format:"%s" --no-merges | grep -E "^\[func_add"    | clean | sed 's/^/- /' || true)
          UPDT=$(git log $RANGE --pretty=format:"%s" --no-merges | grep -E "^\[func_update" | clean | sed 's/^/- /' || true)
          FIXS=$(git log $RANGE --pretty=format:"%s" --no-merges | grep -E "^\[bug_fix"    | clean | sed 's/^/- /' || true)
          {
            echo "## 🎉 What's Changed"
            echo ""
            [ -n "$FEAT" ] && { echo "### ✨ New Features"; echo "$FEAT"; echo ""; }
            [ -n "$UPDT" ] && { echo "### 🔧 Improvements"; echo "$UPDT"; echo ""; }
            [ -n "$FIXS" ] && { echo "### 🐛 Bug Fixes"; echo "$FIXS"; echo ""; }
          } > release_body.txt
          DELIM="GHABODY"
          echo "body<<$DELIM" >> "$GITHUB_OUTPUT"
          cat release_body.txt >> "$GITHUB_OUTPUT"
          echo "$DELIM" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LLM Switch v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
